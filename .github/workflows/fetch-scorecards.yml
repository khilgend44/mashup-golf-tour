name: Fetch Live Scorecards

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:        # also allows manual run from GitHub UI

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Fetch scorecards for active season events
        env:
          SGT_API_KEY: ${{ secrets.SGT_API_KEY }}
          STREAM_IMPORT_SECRET: ${{ secrets.STREAM_IMPORT_SECRET }}
        run: |
          # Find the active season ID — merge static file + KV (KV takes precedence)
          STATIC_SEASONS=$(cat data/seasons.json)
          KV_SEASONS=$(curl -sf "https://mashup-golf-tour.pages.dev/api/seasons" || echo "[]")
          ALL_SEASONS=$(jq -n \
            --argjson static "$STATIC_SEASONS" \
            --argjson kv "$KV_SEASONS" \
            '($static + $kv) | reduce .[] as $s ({}; .[$s.id] = $s) | to_entries | map(.value)')
          ACTIVE_SEASON=$(echo "$ALL_SEASONS" | jq -r '.[] | select(.status == "active") | .id' | head -1)

          if [ -z "$ACTIVE_SEASON" ]; then
            echo "No active season found — nothing to fetch."
            exit 0
          fi

          echo "Active season: $ACTIVE_SEASON"

          # Load static events from repo
          STATIC_EVENTS=$(cat data/events.json)

          # Load admin-created events from Cloudflare KV via deployed API
          KV_EVENTS=$(curl -sf "https://mashup-golf-tour.pages.dev/api/events-admin?type=events" || echo "[]")
          echo "KV events fetched: $(echo "$KV_EVENTS" | jq 'length') events"

          # Merge both arrays, deduplicate by id (KV takes precedence over static)
          ALL_EVENTS=$(jq -n \
            --argjson static "$STATIC_EVENTS" \
            --argjson kv "$KV_EVENTS" \
            '($static + $kv) | reduce .[] as $e ({}; .[$e.id] = $e) | to_entries | map(.value)')

          # Get tournament IDs to fetch for the active season: every active
          # event, plus any completed one that still has a recorded CTP
          # winner with no video link yet — a player can link their stream
          # on SGT any time, including after their event closes, so this
          # stays in scope only until the gap is filled (then the completed
          # event naturally drops out of this list on its own next run).
          TOURNAMENT_IDS=$(echo "$ALL_EVENTS" | jq -r \
            --arg season "$ACTIVE_SEASON" \
            '.[] | select(.season == $season and (
                .status == "active" or
                (.status == "completed" and ([.ctp[]? | select((.video // "") == "")] | length) > 0)
              )) | .tournamentId')

          if [ -z "$TOURNAMENT_IDS" ]; then
            echo "No events with status=active to fetch for $ACTIVE_SEASON."
            exit 0
          fi

          echo "Tournaments to fetch: $(echo "$TOURNAMENT_IDS" | tr '\n' ' ')"

          # The stream-gap check below calls MashUp's get-streams endpoint,
          # which does a KV "list" operation — a much lower daily cap (1,000)
          # than reads, and the one that actually tripped Cloudflare's
          # usage-cap warning (2026-10). This thins out how often the stream
          # check itself runs, to roughly every 25 minutes.
          #
          # Used to gate on the run's own UTC clock minute being an exact
          # multiple of 30 — assumed this workflow is only ever ticked by
          # its own `*/10 * * * *` schedule, landing on a predictable
          # minute. Confirmed broken live 2026-10-29: whatever's actually
          # triggering these runs (every run this whole day showed up as
          # workflow_dispatch, not schedule — see `gh run list`, cause
          # unconfirmed) lands at arbitrary minute offsets, so the exact-
          # minute match missed on all 100+ runs that day. Net effect: the
          # SGT-side stream-gap import silently never ran for a full day,
          # which is exactly how cloverlinksgolf's SGT-native stream link
          # went undetected despite parse_streams.py/stream_gaps.py both
          # correctly finding it the moment they were run by hand. A
          # persisted last-checked timestamp is immune to this regardless
          # of what ends up calling the workflow or how often.
          STREAM_CHECK_STATE="data/.stream-check-state"
          NOW_TS=$(date -u +%s)
          LAST_TS=$(cat "$STREAM_CHECK_STATE" 2>/dev/null || echo 0)
          if [ $((NOW_TS - LAST_TS)) -ge 1500 ]; then
            CHECK_STREAMS=1
            echo "$NOW_TS" > "$STREAM_CHECK_STATE"
          else
            CHECK_STREAMS=0
            echo "Skipping the stream-gap check this run (last checked $(( (NOW_TS - LAST_TS) / 60 )) min ago)."
          fi

          echo "$TOURNAMENT_IDS" | while read tid; do
            echo "Fetching tournament $tid..."
            curl -sf \
              "https://simulatorgolftour.com/sgt-api/mashup/tournaments/${tid}/scorecards?key=${SGT_API_KEY}&noTruncate" \
              -o "data/scorecards/${tid}.json"
            echo "  → saved data/scorecards/${tid}.json"
          done

          # Closest-to-pin (CTP). No official endpoint exists for this like
          # the keyed scorecards API above — this scrapes the same internal
          # AJAX endpoint SGT's own tournament page uses for its CTP tab.
          # It needs a fresh session cookie plus AJAX-style headers, or it
          # silently falls back to a generic HTML page instead of the data.
          # See .github/scripts/parse_ctp.py for why this is accepted as a
          # "fix it if it breaks" dependency rather than a stable API.
          mkdir -p data/ctp
          echo "$TOURNAMENT_IDS" | while read tid; do
            echo "Fetching CTP for tournament $tid..."
            cookiejar=$(mktemp)
            curl -sf -c "$cookiejar" "https://simulatorgolftour.com/tournament/${tid}" -o /dev/null \
              || { echo "  → couldn't get a session cookie for $tid, skipping CTP"; rm -f "$cookiejar"; continue; }

            rawhtml=$(mktemp)
            curl -sf -b "$cookiejar" \
              -H "X-Requested-With: XMLHttpRequest" \
              -H "Referer: https://simulatorgolftour.com/tournament/${tid}" \
              "https://simulatorgolftour.com/sgt-api/leaderboard/${tid}/ctp" \
              -o "$rawhtml" || { echo "  → CTP fetch failed for $tid, skipping"; rm -f "$cookiejar" "$rawhtml"; continue; }

            python3 .github/scripts/parse_ctp.py "$rawhtml" > "data/ctp/${tid}.json"
            echo "  → saved data/ctp/${tid}.json"

            # Streams some players post directly on SGT's own tournament
            # page instead of MashUp's submission form — same session
            # cookie, same leaderboard family of endpoints, just the plain
            # leaderboard view (not the /ctp subview) since that's where
            # SGT renders each player's "stream-link" dropdown entries.
            # See parse_streams.py / stream_gaps.py / import-sgt-stream.js
            # for the parse → diff → write-if-absent pipeline.
            EVENT_ID=$(echo "$ALL_EVENTS" | jq -r --argjson tid "$tid" '[.[] | select(.tournamentId == $tid)][0].id // empty')
            EVENT_NAME=$(echo "$ALL_EVENTS" | jq -r --argjson tid "$tid" '[.[] | select(.tournamentId == $tid)][0].name // empty')
            if [ -z "$EVENT_ID" ]; then
              echo "  → no matching event id for tournament $tid, skipping stream check"
              rm -f "$cookiejar" "$rawhtml"
              continue
            fi

            lbhtml=$(mktemp)
            if curl -sf -b "$cookiejar" \
              -H "X-Requested-With: XMLHttpRequest" \
              -H "Referer: https://simulatorgolftour.com/tournament/${tid}" \
              "https://simulatorgolftour.com/sgt-api/leaderboard/${tid}" \
              -o "$lbhtml"; then

              sgt_streams=$(mktemp)
              python3 .github/scripts/parse_streams.py "$lbhtml" > "$sgt_streams"

              # Defaults to an empty set so the CTP-video-linking sections
              # further down (which only ever use this as a secondary,
              # optional signal) degrade gracefully on a skipped run instead
              # of erroring — they just find fewer shared-teammate matches
              # until the next 30-minute check, never a wrong one.
              mashup_streams=$(mktemp)
              echo "{}" > "$mashup_streams"

              if [ "$CHECK_STREAMS" = "1" ]; then
                curl -sf "https://mashup-golf-tour.pages.dev/api/get-streams?eventId=${EVENT_ID}" -o "$mashup_streams" || echo "{}" > "$mashup_streams"

                gaps=$(python3 .github/scripts/stream_gaps.py "$sgt_streams" "$mashup_streams")
                count=$(echo "$gaps" | jq 'length')

                if [ "$count" != "0" ] && [ -n "$STREAM_IMPORT_SECRET" ]; then
                  echo "  → found $count stream(s) on SGT missing from MashUp, importing..."
                  payload=$(jq -n --arg eventId "$EVENT_ID" --arg eventName "$EVENT_NAME" --argjson items "$gaps" \
                    '{eventId: $eventId, eventName: $eventName, items: $items}')
                  curl -sf -X POST "https://mashup-golf-tour.pages.dev/api/import-sgt-stream" \
                    -H "Content-Type: application/json" \
                    -H "X-Cron-Secret: ${STREAM_IMPORT_SECRET}" \
                    -d "$payload" || echo "  → stream import request failed"
                else
                  echo "  → no missing streams found for $EVENT_ID"
                fi
              fi

              # CTP video auto-linking. A player who links their stream
              # through SGT's own system (not MashUp's submission form) gets
              # exact per-hole shot timing for free — SGT's own "jump to
              # this hole in the video" offset, confirmed accurate (unlike
              # its separate per-shot offset, which drifts by a different,
              # unpredictable amount per stream). This only ever fills a
              # CTP entry's `video` field when it's still empty. See
              # ctp_video_link.py for why this takes several fetches: the
              # URL slug in a scorecard link isn't the id SGT's own API
              # needs, so each candidate needs its own scorecard-page fetch
              # to resolve the real one first.
              #
              # Critical: teammates on a team format share ONE scorecard, so
              # the `stream` step below finds whichever teammate's stream is
              # attached to it — not necessarily the CTP winner's own. Bug
              # confirmed live: ryanlane10 won a CTP but shared a scorecard
              # with jibbsy, who had linked his own stream; the pipeline
              # resolved jibbsy's video as if it were ryanlane10's shot,
              # because it never checked whose stream it actually was. SGT's
              # own markup does name the specific player when a team stream
              # link is disambiguated (parse_streams.py already extracts
              # this correctly for the stream-gap-import step above, kept
              # alive in $sgt_streams rather than deleted immediately) —
              # every candidate below is checked against it and skipped if
              # the CTP winner themselves never linked a stream, even when
              # their shared scorecard has one attached.
              #
              # Two teammates who genuinely share one physical broadcast
              # (same sim bay, one camera) can both still get auto-linked.
              # Either of two explicit signals is accepted — never an
              # inferred guess: (a) the teammate separately linked that same
              # video through SGT's own system under their own name (SGT's
              # markup supports more than one stream-menu-item per team row,
              # so parse_streams.py already picks up both independently), or
              # (b) MashUp's own stream submission (get-streams — kept alive
              # in $mashup_streams below rather than deleted after the
              # stream-gap step above) already has that teammate registered
              # to the EXACT SAME url as whoever linked it on SGT — e.g.
              # pottsy tagging both himself and ryanlane10 to one video in a
              # single MashUp submission. That's a deliberate declaration
              # from a real person, same as (a), just made through MashUp's
              # form instead of SGT's. Deliberately NOT inferring shared
              # coverage from matching scores between a teammate's own
              # hole-by-hole data and the stream owner's — SGT's per-shot
              # numbers inside a shared stream have been observed to reflect
              # a *different* teammate than the one who linked it, so whose
              # shots are actually in a given broadcast isn't reliably
              # derivable from play data alone.
              EVENT_CTP=$(echo "$ALL_EVENTS" | jq -c --argjson tid "$tid" '[.[] | select(.tournamentId == $tid)][0].ctp // []')
              NEEDED=$(echo "$EVENT_CTP" | jq -c '[.[] | select((.video // "") == "") | {hole, player}]')
              nc=$(echo "$NEEDED" | jq 'length')

              if [ "$nc" != "0" ] && [ -n "$STREAM_IMPORT_SECRET" ]; then
                echo "  → resolving video links for $nc CTP hole(s) without one yet..."
                CTP_VIDEOS="[]"
                for row in $(echo "$NEEDED" | jq -c '.[]'); do
                  hole=$(echo "$row" | jq -r '.hole')
                  player=$(echo "$row" | jq -r '.player')

                  # This player must have linked their OWN stream, OR be
                  # registered on MashUp's own stream data to the exact same
                  # video (by id, since SGT's and MashUp's URL shapes for
                  # the same video differ) as whoever did link it on SGT —
                  # not just share a scorecard with a teammate who happens
                  # to have a stream attached (see the notes above). A
                  # missing/unreadable file fails closed (treated as no
                  # match, so this skips rather than risks guessing wrong).
                  player_lower=$(echo "$player" | tr '[:upper:]' '[:lower:]')
                  owns_stream=$(jq -r --arg p "$player_lower" '[.[] | select(.player == $p)] | length' "$sgt_streams" 2>/dev/null || echo 0)
                  if [ "$owns_stream" = "0" ]; then
                    my_urls=$(jq -r --arg p "$player_lower" '.[$p] // {} | to_entries | map(.value) | .[]' "$mashup_streams" 2>/dev/null)
                    sgt_video_ids=$(jq -r '.[].url' "$sgt_streams" 2>/dev/null | while read -r u; do python3 .github/scripts/ctp_video_link.py videoid "$u"; done)
                    while read -r my_url; do
                      [ -z "$my_url" ] && continue
                      my_vid=$(python3 .github/scripts/ctp_video_link.py videoid "$my_url")
                      [ -z "$my_vid" ] && continue
                      if echo "$sgt_video_ids" | grep -qx "$my_vid"; then owns_stream=1; break; fi
                    done <<< "$my_urls"
                  fi
                  [ "$owns_stream" = "0" ] && continue

                  slug=$(python3 .github/scripts/ctp_video_link.py slug "$lbhtml" "$player")
                  [ -z "$slug" ] && continue

                  scpage=$(mktemp)
                  curl -sf -H "Referer: https://simulatorgolftour.com/tournament/${tid}" -H "User-Agent: Mozilla/5.0" \
                    "https://simulatorgolftour.com/scorecard/${tid}/${slug}" -o "$scpage" || { rm -f "$scpage"; continue; }
                  pidteam=$(python3 .github/scripts/ctp_video_link.py pid "$scpage")
                  rm -f "$scpage"
                  [ -z "$pidteam" ] && continue
                  pid=$(echo "$pidteam" | cut -d' ' -f1)
                  team=$(echo "$pidteam" | cut -d' ' -f2)

                  scdefault=$(mktemp)
                  curl -sf -H "Referer: https://simulatorgolftour.com/" -H "User-Agent: Mozilla/5.0" \
                    "https://simulatorgolftour.com/sgt-api/scorecard/${tid}/${pid}/${team}" -o "$scdefault" || { rm -f "$scdefault"; continue; }
                  streamvideo=$(python3 .github/scripts/ctp_video_link.py stream "$scdefault" "$player")
                  rm -f "$scdefault"
                  [ -z "$streamvideo" ] && continue
                  streamid=$(echo "$streamvideo" | cut -d' ' -f1)
                  videoid=$(echo "$streamvideo" | cut -d' ' -f2)

                  scstream=$(mktemp)
                  curl -sf -H "Referer: https://simulatorgolftour.com/" -H "User-Agent: Mozilla/5.0" \
                    "https://simulatorgolftour.com/sgt-api/scorecard/${tid}/${pid}/${team}/stream/${streamid}" -o "$scstream" || { rm -f "$scstream"; continue; }
                  offset=$(python3 .github/scripts/ctp_video_link.py offset "$scstream" "$hole")
                  rm -f "$scstream"
                  [ -z "$offset" ] && continue

                  video="https://www.youtube.com/watch?v=${videoid}&t=${offset}s"
                  CTP_VIDEOS=$(echo "$CTP_VIDEOS" | jq -c --argjson hole "$hole" --arg player "$player" --arg video "$video" '. + [{hole: $hole, player: $player, video: $video}]')
                done

                vcount=$(echo "$CTP_VIDEOS" | jq 'length')
                if [ "$vcount" != "0" ]; then
                  echo "  → found $vcount CTP video link(s), importing..."
                  payload=$(jq -n --arg eventId "$EVENT_ID" --argjson items "$CTP_VIDEOS" '{eventId: $eventId, items: $items}')
                  curl -sf -X POST "https://mashup-golf-tour.pages.dev/api/import-ctp-video" \
                    -H "Content-Type: application/json" \
                    -H "X-Cron-Secret: ${STREAM_IMPORT_SECRET}" \
                    -d "$payload" || echo "  → CTP video import request failed"
                else
                  echo "  → no resolvable CTP videos this run"
                fi
              fi

              # Live-leaderboard CTP video links — for the public event
              # page's "Closest to the Pin — Live" cards, while a hole's
              # winner isn't recorded in admin's ctp[] at all yet (that
              # only gets written when the admin completes the event). The
              # candidates here are EVERY player on each hole's leaders[]
              # list, not just leaders[0] (the current leader) — event.html
              # shows the full mini-leaderboard per hole, and any entry on
              # it can carry its own video if that player (or a teammate)
              # has linked a stream, same as the current leader always
              # could. Unlike the admin ctp[] step above, this file is
              # fully regenerated every run (same as data/ctp/*.json
              # itself) rather than merged, since it's just a live snapshot
              # of who's leading right now, not a permanent record — keyed
              # by round:hole:player so a leader change can never show a
              # stale shot's video by mistake.
              mkdir -p data/ctp-video
              LIVE_CANDIDATES=$(jq -c '[.rounds[]? | .round as $r | .holes[]? | select(.leaders | length > 0) | .hole as $h | .leaders[] | {round: $r, hole: $h, player: .player}]' "data/ctp/${tid}.json" 2>/dev/null || echo "[]")
              lc=$(echo "$LIVE_CANDIDATES" | jq 'length')

              if [ "$lc" != "0" ]; then
                echo "  → resolving live-leaderboard video links for $lc hole(s)..."
                LIVE_VIDEOS="[]"
                for row in $(echo "$LIVE_CANDIDATES" | jq -c '.[]'); do
                  round=$(echo "$row" | jq -r '.round')
                  hole=$(echo "$row" | jq -r '.hole')
                  player=$(echo "$row" | jq -r '.player')

                  # This player must have linked their OWN stream, OR be
                  # registered on MashUp's own stream data to the exact same
                  # video (by id, since SGT's and MashUp's URL shapes for
                  # the same video differ) as whoever did link it on SGT —
                  # not just share a scorecard with a teammate who happens
                  # to have a stream attached (see the notes above). A
                  # missing/unreadable file fails closed (treated as no
                  # match, so this skips rather than risks guessing wrong).
                  player_lower=$(echo "$player" | tr '[:upper:]' '[:lower:]')
                  owns_stream=$(jq -r --arg p "$player_lower" '[.[] | select(.player == $p)] | length' "$sgt_streams" 2>/dev/null || echo 0)
                  if [ "$owns_stream" = "0" ]; then
                    my_urls=$(jq -r --arg p "$player_lower" '.[$p] // {} | to_entries | map(.value) | .[]' "$mashup_streams" 2>/dev/null)
                    sgt_video_ids=$(jq -r '.[].url' "$sgt_streams" 2>/dev/null | while read -r u; do python3 .github/scripts/ctp_video_link.py videoid "$u"; done)
                    while read -r my_url; do
                      [ -z "$my_url" ] && continue
                      my_vid=$(python3 .github/scripts/ctp_video_link.py videoid "$my_url")
                      [ -z "$my_vid" ] && continue
                      if echo "$sgt_video_ids" | grep -qx "$my_vid"; then owns_stream=1; break; fi
                    done <<< "$my_urls"
                  fi
                  [ "$owns_stream" = "0" ] && continue

                  slug=$(python3 .github/scripts/ctp_video_link.py slug "$lbhtml" "$player")
                  [ -z "$slug" ] && continue

                  scpage=$(mktemp)
                  curl -sf -H "Referer: https://simulatorgolftour.com/tournament/${tid}" -H "User-Agent: Mozilla/5.0" \
                    "https://simulatorgolftour.com/scorecard/${tid}/${slug}" -o "$scpage" || { rm -f "$scpage"; continue; }
                  pidteam=$(python3 .github/scripts/ctp_video_link.py pid "$scpage")
                  rm -f "$scpage"
                  [ -z "$pidteam" ] && continue
                  pid=$(echo "$pidteam" | cut -d' ' -f1)
                  team=$(echo "$pidteam" | cut -d' ' -f2)

                  scdefault=$(mktemp)
                  curl -sf -H "Referer: https://simulatorgolftour.com/" -H "User-Agent: Mozilla/5.0" \
                    "https://simulatorgolftour.com/sgt-api/scorecard/${tid}/${pid}/${team}" -o "$scdefault" || { rm -f "$scdefault"; continue; }
                  streamvideo=$(python3 .github/scripts/ctp_video_link.py stream "$scdefault" "$player")
                  rm -f "$scdefault"
                  [ -z "$streamvideo" ] && continue
                  streamid=$(echo "$streamvideo" | cut -d' ' -f1)
                  videoid=$(echo "$streamvideo" | cut -d' ' -f2)

                  scstream=$(mktemp)
                  curl -sf -H "Referer: https://simulatorgolftour.com/" -H "User-Agent: Mozilla/5.0" \
                    "https://simulatorgolftour.com/sgt-api/scorecard/${tid}/${pid}/${team}/stream/${streamid}" -o "$scstream" || { rm -f "$scstream"; continue; }
                  offset=$(python3 .github/scripts/ctp_video_link.py offset "$scstream" "$hole")
                  rm -f "$scstream"
                  [ -z "$offset" ] && continue

                  video="https://www.youtube.com/watch?v=${videoid}&t=${offset}s"
                  LIVE_VIDEOS=$(echo "$LIVE_VIDEOS" | jq -c --argjson round "$round" --argjson hole "$hole" --arg player "$player" --arg video "$video" '. + [{round: $round, hole: $hole, player: $player, video: $video}]')
                done
                echo "$LIVE_VIDEOS" > "data/ctp-video/${tid}.json"
                echo "  → saved data/ctp-video/${tid}.json ($(echo "$LIVE_VIDEOS" | jq 'length') link(s))"
              else
                echo "[]" > "data/ctp-video/${tid}.json"
              fi
            else
              echo "  → leaderboard fetch failed for $tid, skipping stream check"
            fi

            rm -f "$cookiejar" "$rawhtml" "$lbhtml" "$sgt_streams" "$mashup_streams"
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scorecards/ data/ctp/ data/ctp-video/ data/.stream-check-state
          if git diff --staged --quiet; then
            echo "No scorecard changes — skipping commit."
          else
            git commit -m "chore: refresh live scorecards + CTP $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
