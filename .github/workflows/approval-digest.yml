name: Daily Approval Digest

on:
  schedule:
    - cron: '0 14 * * *'  # once daily, ~9-10am US Eastern (adjust as needed)
  workflow_dispatch:       # also allows manual run from GitHub UI

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger approval digest
        run: |
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST "https://mashup-golf-tour.pages.dev/api/approval-digest" \
            -H "X-Cron-Secret: ${{ secrets.DIGEST_CRON_SECRET }}")
          echo "HTTP status: $HTTP_CODE"
          echo "Response body:"
          cat response.json
          echo
          if [ "$HTTP_CODE" -ge 400 ]; then
            exit 1
          fi
