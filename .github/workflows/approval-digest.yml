name: Daily Approval Digest

# The daily trigger lives on a Cloudflare Worker cron now (mashup-approval-digest),
# not GitHub's schedule trigger — it silently skipped runs entirely rather than
# just running late, matching the same unreliability that's why the scorecard
# fetch workflow is triggered by a Cloudflare Worker too (see ARCHITECTURE.md).
# workflow_dispatch is kept as a manual fallback/testing trigger only.
on:
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger approval digest
        run: |
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST "https://mashup-golf-tour.pages.dev/api/approval-digest" \
            -H "X-Cron-Secret: ${{ secrets.DIGEST_CRON_SECRET }}")
          echo "HTTP status: $HTTP_CODE"
          echo "Response body:"
          cat response.json
          echo
          if [ "$HTTP_CODE" -ge 400 ]; then
            exit 1
          fi
