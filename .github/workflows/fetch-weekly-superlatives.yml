name: Fetch Weekly Superlatives

on:
  schedule:
    - cron: '0 * * * *'   # hourly — these are weekly stats, not a per-shot
                           # race like CTP timing, so this is plenty
                           # responsive without hammering SGT's servers with
                           # the ~2 extra requests per team/solo entry this
                           # needs on top of the 10-minute scorecard cron.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Compute Drive/Approach/Putt of the Week for active events
        run: |
          # Resolves a timestamped YouTube link for one superlative winner,
          # reusing the exact same accuracy/safety rules as the CTP-video
          # pipeline in fetch-scorecards.yml (kept here as its own copy,
          # same convention this repo already follows rather than sharing
          # code between workflow files):
          #   - a player only gets linked if they personally linked a
          #     stream on SGT, OR MashUp's own stream data already has them
          #     registered to the exact same video (by id) as a teammate
          #     who did — never inferred from matching scores
          #   - when a team has multiple teammates who each linked their
          #     OWN separate stream, the correct one is picked by name, not
          #     just the first one SGT's markup happens to list (confirmed
          #     live: cloverlinksgolf and winch99 each linked a different
          #     video, and the naive first-match approach resolved both of
          #     them to winch99's)
          #   - a drive (always a hole's first/tee shot) uses the hole-
          #     level "Play hole N" offset, confirmed accurate. An approach
          #     or putt (never the first shot) uses that SPECIFIC shot's
          #     own offset instead, but ONLY when that shot's own on-screen
          #     value (remaining distance, or putt length) matches the
          #     value already recorded for it — confirmed live as required,
          #     not optional: the per-shot breakdown embedded in a team's
          #     stream view has been observed to reflect one specific
          #     teammate's own numbers regardless of whose correctly-
          #     resolved stream you're actually looking at (cloverlinksgolf
          #     and winch99 again — cloverlinksgolf's own stream still
          #     showed winch99's shot sequence for a shared hole). No
          #     verified match means no link, not a best-effort guess.
          # Echoes the video URL on success, nothing on failure — every
          # failure path is a silent skip, not an error, since most of the
          # field hasn't linked a stream at all.
          resolve_video() {
            local tid="$1" hole="$2" player="$3" shot_num="$4" expected_value="$5"
            local lbhtml="$6" sgt_streams="$7" mashup_streams="$8"
            local player_lower owns_stream slug scpage pidteam pid team
            local scdefault streamvideo streamid videoid scstream offset

            player_lower=$(echo "$player" | tr '[:upper:]' '[:lower:]')
            owns_stream=$(jq -r --arg p "$player_lower" '[.[] | select(.player == $p)] | length' "$sgt_streams" 2>/dev/null || echo 0)
            if [ "$owns_stream" = "0" ]; then
              local my_urls sgt_video_ids my_url my_vid
              my_urls=$(jq -r --arg p "$player_lower" '.[$p] // {} | to_entries | map(.value) | .[]' "$mashup_streams" 2>/dev/null)
              sgt_video_ids=$(jq -r '.[].url' "$sgt_streams" 2>/dev/null | while read -r u; do python3 .github/scripts/ctp_video_link.py videoid "$u"; done)
              while read -r my_url; do
                [ -z "$my_url" ] && continue
                my_vid=$(python3 .github/scripts/ctp_video_link.py videoid "$my_url")
                [ -z "$my_vid" ] && continue
                if echo "$sgt_video_ids" | grep -qx "$my_vid"; then owns_stream=1; break; fi
              done <<< "$my_urls"
            fi
            [ "$owns_stream" = "0" ] && return

            slug=$(python3 .github/scripts/ctp_video_link.py slug "$lbhtml" "$player")
            [ -z "$slug" ] && return

            scpage=$(mktemp)
            curl -sf -H "Referer: https://simulatorgolftour.com/tournament/${tid}" -H "User-Agent: Mozilla/5.0" \
              "https://simulatorgolftour.com/scorecard/${tid}/${slug}" -o "$scpage" || { rm -f "$scpage"; return; }
            pidteam=$(python3 .github/scripts/ctp_video_link.py pid "$scpage")
            rm -f "$scpage"
            [ -z "$pidteam" ] && return
            pid=$(echo "$pidteam" | cut -d' ' -f1)
            team=$(echo "$pidteam" | cut -d' ' -f2)

            scdefault=$(mktemp)
            curl -sf -H "Referer: https://simulatorgolftour.com/" -H "User-Agent: Mozilla/5.0" \
              "https://simulatorgolftour.com/sgt-api/scorecard/${tid}/${pid}/${team}" -o "$scdefault" || { rm -f "$scdefault"; return; }
            streamvideo=$(python3 .github/scripts/ctp_video_link.py stream "$scdefault" "$player")
            rm -f "$scdefault"
            [ -z "$streamvideo" ] && return
            streamid=$(echo "$streamvideo" | cut -d' ' -f1)
            videoid=$(echo "$streamvideo" | cut -d' ' -f2)

            scstream=$(mktemp)
            curl -sf -H "Referer: https://simulatorgolftour.com/" -H "User-Agent: Mozilla/5.0" \
              "https://simulatorgolftour.com/sgt-api/scorecard/${tid}/${pid}/${team}/stream/${streamid}" -o "$scstream" || { rm -f "$scstream"; return; }
            if [ -z "$shot_num" ] || [ "$shot_num" = "null" ]; then
              offset=$(python3 .github/scripts/ctp_video_link.py offset "$scstream" "$hole")
            else
              offset=$(python3 .github/scripts/ctp_video_link.py shotoffset "$scstream" "$hole" "$shot_num" "$expected_value")
            fi
            rm -f "$scstream"
            [ -z "$offset" ] && return

            echo "https://www.youtube.com/watch?v=${videoid}&t=${offset}s"
          }

          STATIC_SEASONS=$(cat data/seasons.json)
          KV_SEASONS=$(curl -sf "https://mashup-golf-tour.pages.dev/api/seasons" || echo "[]")
          ALL_SEASONS=$(jq -n \
            --argjson static "$STATIC_SEASONS" \
            --argjson kv "$KV_SEASONS" \
            '($static + $kv) | reduce .[] as $s ({}; .[$s.id] = $s) | to_entries | map(.value)')
          ACTIVE_SEASON=$(echo "$ALL_SEASONS" | jq -r '.[] | select(.status == "active") | .id' | head -1)

          if [ -z "$ACTIVE_SEASON" ]; then
            echo "No active season found — nothing to compute."
            exit 0
          fi

          STATIC_EVENTS=$(cat data/events.json)
          KV_EVENTS=$(curl -sf "https://mashup-golf-tour.pages.dev/api/events-admin?type=events" || echo "[]")
          ALL_EVENTS=$(jq -n \
            --argjson static "$STATIC_EVENTS" \
            --argjson kv "$KV_EVENTS" \
            '($static + $kv) | reduce .[] as $e ({}; .[$e.id] = $e) | to_entries | map(.value)')

          # Only events still being played — once an event completes, its
          # last computed file while active is already the final answer,
          # no need to keep refetching a closed week every hour forever.
          TOURNAMENT_IDS=$(echo "$ALL_EVENTS" | jq -r \
            --arg season "$ACTIVE_SEASON" \
            '.[] | select(.season == $season and .status == "active") | .tournamentId')

          if [ -z "$TOURNAMENT_IDS" ]; then
            echo "No active events to compute for $ACTIVE_SEASON."
            exit 0
          fi

          mkdir -p data/superlatives

          echo "$TOURNAMENT_IDS" | while read tid; do
            echo "Computing superlatives for tournament $tid..."

            cookiejar=$(mktemp)
            curl -sf -c "$cookiejar" "https://simulatorgolftour.com/tournament/${tid}" -o /dev/null \
              || { echo "  → couldn't get a session cookie, skipping"; rm -f "$cookiejar"; continue; }

            lbhtml=$(mktemp)
            curl -sf -b "$cookiejar" \
              -H "X-Requested-With: XMLHttpRequest" \
              -H "Referer: https://simulatorgolftour.com/tournament/${tid}" \
              "https://simulatorgolftour.com/sgt-api/leaderboard/${tid}" -o "$lbhtml" \
              || { echo "  → leaderboard fetch failed, skipping"; rm -f "$cookiejar" "$lbhtml"; continue; }
            rm -f "$cookiejar"

            # One representative player per scorecard entry (team or solo —
            # see ctp_video_link.py's `reps` step for why teammates only
            # need fetching once). Each rep's shots fragment is parsed on
            # its own and appended as one line of a JSONL file, since a
            # piped `while read` loop runs in a subshell and can't
            # accumulate results into a bash variable the way a plain
            # variable append can elsewhere in this repo's scripts.
            fragments=$(mktemp)
            python3 .github/scripts/ctp_video_link.py reps "$lbhtml" | while read -r player slug; do
              [ -z "$slug" ] && continue

              scpage=$(mktemp)
              curl -sf -H "Referer: https://simulatorgolftour.com/tournament/${tid}" -H "User-Agent: Mozilla/5.0" \
                "https://simulatorgolftour.com/scorecard/${tid}/${slug}" -o "$scpage" || { rm -f "$scpage"; continue; }
              pidteam=$(python3 .github/scripts/ctp_video_link.py pid "$scpage")
              rm -f "$scpage"
              [ -z "$pidteam" ] && continue
              pid=$(echo "$pidteam" | cut -d' ' -f1)
              team=$(echo "$pidteam" | cut -d' ' -f2)

              shots=$(mktemp)
              curl -sf -H "Referer: https://simulatorgolftour.com/" -H "User-Agent: Mozilla/5.0" \
                "https://simulatorgolftour.com/sgt-api/scorecard/${tid}/${pid}/${team}/shots" -o "$shots" || { rm -f "$shots"; continue; }
              python3 .github/scripts/parse_shots.py "$shots" >> "$fragments"
              rm -f "$shots"
            done

            if [ ! -s "$fragments" ]; then
              echo "  → no shot data resolved for $tid, leaving superlatives file as-is"
              rm -f "$fragments" "$lbhtml"
              continue
            fi

            jq -s '{
              drives:     [.[].drives[]],
              approaches: [.[].approaches[]],
              putts:      [.[].putts[]]
            }' "$fragments" > "data/superlatives/${tid}.raw.json"
            rm -f "$fragments"

            jq '
              def bestBy(f; pick): (map(f) | pick) as $best | map(select(f == $best));
              {
                tournamentId: '"$tid"',
                generatedAt: (now | strftime("%Y-%m-%dT%H:%M:%SZ")),
                driveOfWeek:    (.drives     | bestBy(.distanceYds; max)),
                approachOfWeek: (.approaches | bestBy(.proximityFt; min)),
                puttOfWeek:     (.putts      | bestBy(.lengthFt;    max))
              }
            ' "data/superlatives/${tid}.raw.json" > "data/superlatives/${tid}.json"
            rm -f "data/superlatives/${tid}.raw.json"

            # Timestamped video links for each winner (a tie means more
            # than one). Only ever resolves for a player who's linked a
            # stream (directly or via the MashUp cross-reference) — most of
            # the field hasn't, so most winners just won't have a video
            # yet, which is expected, not a failure.
            sgt_streams=$(mktemp)
            python3 .github/scripts/parse_streams.py "$lbhtml" > "$sgt_streams"
            EVENT_ID=$(echo "$ALL_EVENTS" | jq -r --argjson tid "$tid" '[.[] | select(.tournamentId == $tid)][0].id // empty')
            mashup_streams=$(mktemp)
            if [ -n "$EVENT_ID" ]; then
              curl -sf "https://mashup-golf-tour.pages.dev/api/get-streams?eventId=${EVENT_ID}" -o "$mashup_streams" || echo "{}" > "$mashup_streams"
            else
              echo "{}" > "$mashup_streams"
            fi

            RESULT=$(cat "data/superlatives/${tid}.json")
            for category in driveOfWeek approachOfWeek puttOfWeek; do
              count=$(echo "$RESULT" | jq --arg c "$category" '.[$c] | length')
              for i in $(seq 0 $((count - 1))); do
                entry=$(echo "$RESULT" | jq --arg c "$category" --argjson i "$i" '.[$c][$i]')
                hole=$(echo "$entry" | jq -r '.hole')
                player=$(echo "$entry" | jq -r '.player')
                # A drive is always a hole's first shot — the hole-level
                # offset (shot_num left empty) already covers it, same as
                # CTP. An approach/putt is never shot 1, so it needs its
                # own verified shot-level offset instead (see resolve_video).
                if [ "$category" = "driveOfWeek" ]; then
                  shot_num=""
                  expected_value=""
                elif [ "$category" = "approachOfWeek" ]; then
                  shot_num=$(echo "$entry" | jq -r '.shotNum')
                  expected_value=$(echo "$entry" | jq -r '.proximityFt')
                else
                  shot_num=$(echo "$entry" | jq -r '.shotNum')
                  expected_value=$(echo "$entry" | jq -r '.lengthFt')
                fi
                video=$(resolve_video "$tid" "$hole" "$player" "$shot_num" "$expected_value" "$lbhtml" "$sgt_streams" "$mashup_streams")
                if [ -n "$video" ]; then
                  RESULT=$(echo "$RESULT" | jq --arg c "$category" --argjson i "$i" --arg video "$video" '.[$c][$i].video = $video')
                fi
              done
            done
            echo "$RESULT" > "data/superlatives/${tid}.json"
            rm -f "$lbhtml" "$sgt_streams" "$mashup_streams"

            echo "  → saved data/superlatives/${tid}.json"
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/superlatives/
          if git diff --staged --quiet; then
            echo "No superlative changes — skipping commit."
          else
            git commit -m "chore: refresh weekly superlatives $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
